<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Compañeros de Rumi</title>
<meta name="theme-color" content="#4f46e5" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root{
    --bg:#f4f1ff; --card:#ffffff; --ink:#241f3d; --muted:#6b6485;
    --accent:#4f46e5; --accent-ink:#ffffff; --line:#e6e1fb;
    --green:#1a9c5e; --yellow:#c98a00; --red:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151327; --card:#1f1c38; --ink:#f1eefc; --muted:#a79fd1; --line:#332e57; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100dvh;}
  .app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px;padding-bottom:32px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .brand{font-weight:700;font-size:1.05rem}
  .stats{display:flex;gap:10px;font-size:0.85rem;color:var(--muted)}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;flex:1;
    display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,10,60,0.04);}
  .week-tag{font-size:0.75rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .heading{font-size:1.3rem;font-weight:700;margin:0}
  .day-tag{font-size:0.85rem;color:var(--muted)}
  .scene-text{font-size:1rem;line-height:1.5;color:var(--ink)}
  .options{display:flex;flex-direction:column;gap:10px;margin-top:auto}
  button.option{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    padding:14px 16px;border-radius:12px;font-size:0.95rem;text-align:left;cursor:pointer;transition:transform .05s ease;}
  button.option:active{transform:scale(0.98)}
  button.primary{appearance:none;border:none;background:var(--accent);color:var(--accent-ink);
    padding:14px 16px;border-radius:12px;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:auto;}
  .diary-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:0.95rem;
    font-family:inherit;background:var(--bg);color:var(--ink);min-height:70px;resize:vertical;}
  .footer-note{font-size:0.75rem;color:var(--muted);text-align:center;margin-top:12px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .semaforo-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .semaforo-row:last-child{border-bottom:none}
  .dot{width:12px;height:12px;border-radius:999px;display:inline-block;margin-right:8px;}
  .dot.verde{background:var(--green)} .dot.amarillo{background:var(--yellow)} .dot.rojo{background:var(--red)} .dot.sin-datos{background:#b9b3d9}
  .install-banner{background:var(--accent);color:#fff;border-radius:12px;padding:12px 14px;font-size:0.85rem;
    display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .install-banner button{background:#fff;color:var(--accent);border:none;border-radius:8px;padding:8px 12px;font-weight:600;font-size:0.8rem;}

  .celebrate{position:relative;align-items:center;overflow:hidden;}
  .celebrate-badge{font-size:3.2rem;text-align:center;animation:celebrate-pop .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes celebrate-pop{0%{transform:scale(0.3);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
  .celebrate-stats{display:flex;gap:22px;justify-content:center;margin:6px 0 4px;}
  .celebrate-stat{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:0.78rem;color:var(--muted);}
  .celebrate-num{font-size:1.1rem;font-weight:700;color:var(--ink);}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .confetti-piece{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:0.9;
    animation:confetti-fall 1.7s linear forwards;}
  .confetti-piece.c0{background:#4f46e5} .confetti-piece.c1{background:#1a9c5e} .confetti-piece.c2{background:#c98a00}
  .confetti-piece.c3{background:#c0392b} .confetti-piece.c4{background:#8b5cf6} .confetti-piece.c5{background:#06b6d4}
  @keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(380px) rotate(240deg);opacity:0}}
</style>
</head>
<body>
  <div class="app">
    <div id="installBanner" class="install-banner">
      <span>Instala la app en tu dispositivo para jugar sin internet</span>
      <button id="installBtn">Instalar</button>
    </div>
    <header>
      <div class="brand">Compañeros de Rumi</div>
      <div class="stats">
        <span class="stat" id="streakStat">🔥 0</span>
        <span class="stat" id="xpStat">⭐ 0 XP</span>
      </div>
    </header>
    <div id="screen"></div>
    <div class="footer-note">Historia "El mapa no muerde" — las 52 semanas completas. El progreso se guarda en este dispositivo.</div>
  </div>

<script src="data.js"></script>
<script src="content-banda.js"></script>
<script src="content-nave.js"></script>
<script src="content-ciudad.js"></script>
<script src="content-guardianes.js"></script>
<script src="content-caso.js"></script>
<script src="content-cordillera.js"></script>
<script src="stories.js"></script>
<script src="app.js"></script>
</body>
</html>
